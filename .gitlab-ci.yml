# ─── Bruno → DevWeb Converter — Docker Image Builder ─────────────────────────────
#
# PURPOSE: Builds and publishes the converter as a Docker image.
#          This pipeline runs ONLY in THIS repository (the converter itself).
#
# IMPORTANT — Runner requirement:
#   The build jobs MUST run on a Linux runner with Docker support.
#   Add a tag below that matches your Linux Docker-capable runner.
#   Example tags: linux, docker, linux-docker, shell-linux
#
# ─────────────────────────────────────────────────────────────────────────────────
# CONSUMER USAGE — how other teams use this in their own pipelines:
#
#  ── Linux runner (recommended, zero setup): ──────────────────────────────────
#   convert:
#     image: registry.gitlab.com/<your-group>/bruno-devweb-converter:latest
#     tags: [linux]
#     script:
#       - bruno-devweb convert -i my-collection.json -o output/
#     artifacts:
#       paths: [output/]
#
#  ── Windows runner (shell executor, Node.js must be installed on runner): ───
#   convert:
#     tags: [windows]
#     before_script:
#       - npm install --prefix %TEMP%\bdw registry.gitlab.com/<your-group>/bruno-devweb-converter
#     script:
#       - node %TEMP%\bdw\node_modules\.bin\bruno-devweb convert -i my-collection.json -o output/
#     artifacts:
#       paths: [output/]
#
#  ── Windows runner (PowerShell, using node directly from repo): ─────────────
#   convert:
#     tags: [windows]
#     before_script:
#       - git clone https://gitlab.com/<your-group>/bruno-devweb-converter.git $env:TEMP\bdw
#       - npm ci --prefix $env:TEMP\bdw --omit=dev
#     script:
#       - node $env:TEMP\bdw\src\cli.js convert -i my-collection.json -o output/
#     artifacts:
#       paths: [output/]
#
# ─────────────────────────────────────────────────────────────────────────────────

stages:
  - build

# ─── Build & push on version tags (e.g. v2.1.1) ─────────────────────────────────
build-release:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  # IMPORTANT: Change this tag to match your Linux runner that has Docker support
  tags:
    - linux
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      docker build \
        --label "org.opencontainers.image.version=$CI_COMMIT_TAG" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        -t $CI_REGISTRY_IMAGE:$VERSION \
        -t $CI_REGISTRY_IMAGE:latest \
        .
      docker push $CI_REGISTRY_IMAGE:$VERSION
      docker push $CI_REGISTRY_IMAGE:latest
      echo "Published $CI_REGISTRY_IMAGE:$VERSION and :latest"

# ─── Build & push :snapshot on every push to main/Dev ────────────────────────────
build-snapshot:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  # IMPORTANT: Change this tag to match your Linux runner that has Docker support
  tags:
    - linux
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "Dev"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:snapshot .
    - docker push $CI_REGISTRY_IMAGE:snapshot
    - echo "Published $CI_REGISTRY_IMAGE:snapshot"
