<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not Found</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:#0f172a;color:#e2e8f0;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .card{
    text-align:center;padding:48px 40px;
    background:#1e293b;border:1px solid #334155;
    border-radius:16px;max-width:440px;width:90%;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  .code{font-size:80px;font-weight:800;color:#3b82f6;line-height:1;margin-bottom:16px}
  h1{font-size:22px;font-weight:700;margin-bottom:10px}
  p{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:28px}
  a{
    display:inline-block;padding:10px 28px;
    background:#2563eb;color:#fff;text-decoration:none;
    border-radius:8px;font-size:14px;font-weight:600;
    transition:background .15s;
  }
  a:hover{background:#1d4ed8}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The URL you requested does not exist.<br>The only valid address is <strong>/converter</strong>.</p>
    <a href="/converter">Go to Converter</a>
  </div>
</body>
</html>
